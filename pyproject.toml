[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viztools"
version = "0.1.3"
description = "Matplotlib styling and ColorBrewer palettes for geospatial visualization"
license = { text = "MIT" }
authors = [{ name = "OutsideKen" }]
requires-python = ">=3.9"

keywords = ["matplotlib", "visualization", "geospatial", "colorbrewer", "palette"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "matplotlib",
    "numpy",
    "webcolors",
    "wherewhen>=0.2.0",
]

[tool.setuptools.packages.find]
where   = ["."]
include = ["viztools*"]

[tool.setuptools.package-data]
viztools = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]